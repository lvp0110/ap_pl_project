# Эталонный server block для ap_pl_project (прод: crmakyfon.constrtodo.ru).
#
# Плейсхолдеры <domain> / <cert_dir> подставляет deploy/deploy-nginx-sync.sh
# из DEPLOY_DOMAIN / DEPLOY_CERT_DIR. Для webtest это:
#   <domain>   = crmakyfon.constrtodo.ru
#   <cert_dir> = /home/leonidl/certs   (общий wildcard *.constrtodo.ru)
#
# Установка вручную (нужен sudo с паролем):
#   sudo sed -e 's|<domain>|crmakyfon.constrtodo.ru|g' \
#            -e 's|<cert_dir>|/home/leonidl/certs|g' \
#            deploy/nginx/crmakyfon.conf \
#     | sudo tee /etc/nginx/sites-available/crmakyfon.conf >/dev/null
#   sudo ln -sf /etc/nginx/sites-available/crmakyfon.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Без этого блока домен попадает в чужой catch-all и отдаёт постороннюю страницу.

server {
    listen      80;
    listen [::]:80;
    server_name <domain>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <domain>;

    ssl_certificate     <cert_dir>/fullchain.pem;
    ssl_certificate_key <cert_dir>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/crmakyfon.access.log;
    error_log  /var/log/nginx/crmakyfon.error.log warn;

    # Импорт прайса и документы проекта — multipart-загрузки.
    client_max_body_size 32m;

    location / {
        # frontend-контейнер: 127.0.0.1:3008 → 3009 внутри контейнера.
        proxy_pass http://127.0.0.1:3008;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }
}
